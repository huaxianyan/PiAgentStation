<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Seven Station Core</title>
<style>
  :root {
    color-scheme: light;
    --page: #f7f7f9;
    --panel: #f7f7f9;
    --card: #ffffff;
    --border: #e9e9ee;
    --border-strong: #dcdce2;
    --active: #ececef;
    --text: #1a1a1d;
    --text-dim: #2c2c31;
    --text-soft: #55555c;
    --text-mute: #8a8a92;
    --text-faint: #a9a9b1;
    --accent: #1a1a1d;
    --green: #189a4a;
    --radius-card: 6px;
    --radius-pill: 999px;
    --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --page: #141417;
    --panel: #16161a;
    --card: #202024;
    --border: #2a2a30;
    --border-strong: #35353c;
    --active: #2a2a30;
    --text: #f2f2f4;
    --text-dim: #e2e2e6;
    --text-soft: #c8c8cf;
    --text-mute: #8f8f98;
    --text-faint: #6e6e77;
    --accent: #f2f2f4;
    --green: #3ddc84;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--page);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    user-select: none;
  }

  /* 内容区：卡片之间的间距和留白都在这里，删了整页会散架。 */
  .body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    overflow: hidden;
  }

  .status-card {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 16px 16px 18px;
    border-radius: var(--radius-card);
    background: var(--card);
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .status-text { flex: 1; min-width: 0; }
  .status-line { display: flex; align-items: center; gap: 9px; }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(24, 154, 74, .12);
  }
  .dot.off { background: var(--text-faint); box-shadow: 0 0 0 4px rgba(140, 140, 150, .12); }
  .status-title { font-size: 15px; font-weight: 600; }
  .status-sub { margin-top: 3px; font-size: 12px; color: var(--text-mute); }
  .status-actions { display: flex; gap: 8px; }

  .btn {
    padding: 7px 13px;
    border: 0;
    border-radius: 9px;
    background: var(--card);
    box-shadow: inset 0 0 0 1px var(--border-strong);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .btn:hover { box-shadow: inset 0 0 0 1px var(--text-faint); }
  .btn.primary { background: var(--accent); color: var(--card); box-shadow: none; }
  .btn.primary:hover { opacity: .88; }
  .btn:disabled { color: var(--text-faint); box-shadow: inset 0 0 0 1px var(--border); cursor: default; }
  .btn[hidden] { display: none; }

  .link {
    padding: 2px 0;
    border: 0;
    background: none;
    color: var(--text-mute);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .link:hover { color: var(--text); }
  .link:disabled { color: var(--text-faint); cursor: default; }
  .link + .link { margin-left: 12px; }

  .card {
    flex: none;
    padding: 14px 16px;
    border-radius: var(--radius-card);
    background: var(--card);
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .card-head h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-dim); }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 36px;
    font-size: 13px;
  }
  .row + .row { border-top: 1px solid var(--border); }
  .row .label { flex: none; width: 80px; color: var(--text-mute); font-size: 12.5px; }
  .row .value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
  .row .value.mono { font-family: var(--mono); font-size: 12px; }
  .row .actions { flex: none; display: flex; align-items: center; }
  .row .note { color: var(--text-mute); font-size: 12.5px; }

  .switch {
    flex: none;
    width: 34px; height: 20px;
    padding: 2px;
    display: flex; align-items: center; justify-content: flex-start;
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--border-strong);
    cursor: pointer;
  }
  .switch.on { background: var(--accent); justify-content: flex-end; }
  .switch:disabled { opacity: .45; cursor: default; }
  .switch i { display: block; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }

  .logs {
    margin: 6px 0 0;
    padding: 9px 11px;
    border-radius: 5px;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--border);
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.62;
    color: var(--text-soft);
    white-space: pre;
    overflow: hidden;
    min-height: 74px;
  }
  .logs .t { color: var(--text-faint); }
  .logs .empty { color: var(--text-faint); font-family: var(--font); }

  .foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px;
    font-size: 11.5px;
    color: var(--text-faint);
  }
  .foot .spacer { flex: 1; }

  /* ---------------- 提示与确认 ---------------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 12px);
    padding: 8px 14px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--card);
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    max-width: 520px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .scrim {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(16, 16, 20, .28);
  }
  .scrim[hidden] { display: none; }
  .dialog {
    width: 380px;
    padding: 18px;
    border-radius: var(--radius-card);
    background: var(--card);
    box-shadow: 0 18px 48px rgba(16, 16, 20, .24);
  }
  .dialog h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .dialog p { margin: 0 0 16px; font-size: 12.5px; line-height: 1.6; color: var(--text-soft); }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>


<div class="body">
  <section class="status-card">
    <div class="status-text">
      <div class="status-line"><span class="dot" id="statusDot"></span><span class="status-title" id="statusTitle">正在读取状态…</span></div>
      <div class="status-sub" id="statusSub"></div>
    </div>
    <div class="status-actions">
      <button class="btn" id="restartBtn" hidden>重启</button>
      <button class="btn primary" id="toggleBtn">停止</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h3>连接</h3></div>
    <div class="row">
      <span class="label">访问地址</span>
      <span class="value mono" id="address"></span>
      <span class="actions">
        <button class="link" id="copyAddress">复制</button>
        <button class="link" id="openAddress">打开</button>
      </span>
    </div>
    <div class="row">
      <span class="label">访问令牌</span>
      <span class="value mono" id="token"></span>
      <span class="actions">
        <button class="link" id="copyToken">复制</button>
        <button class="link" id="regenToken">重新生成</button>
      </span>
    </div>
    <div class="row">
      <span class="label">数据目录</span>
      <span class="value mono" id="dataDir"></span>
      <span class="actions"><button class="link" id="openData">打开</button></span>
    </div>
    <div class="row">
      <span class="label">版本</span>
      <span class="value" id="version"></span>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h3>启动与连接</h3></div>
    <div class="row">
      <span class="label">开机自启</span>
      <span class="value" id="autostartText">系统启动时自动运行</span>
      <button class="switch" id="autostartSwitch"><i></i></button>
    </div>
    <div class="row">
      <span class="label">局域网连接</span>
      <span class="value note">局域网里的其他设备也能连</span>
      <button class="switch" id="lanSwitch"><i></i></button>
    </div>
  </section>

  <section class="card" style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
    <div class="card-head"><h3>最近日志</h3><button class="link" id="openLogs">打开目录</button></div>
    <pre class="logs" id="logs"></pre>
  </section>

  <div class="foot">
    <span id="footNote"></span>
    <span class="spacer"></span>
    <span>关掉窗口不会停掉 Seven Station Core · 右键托盘图标可退出</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="scrim" id="scrim" hidden>
  <div class="dialog">
    <h3>重新生成访问令牌</h3>
    <p>现在连着的设备都会断开，得用新令牌重新连一次。已经跑起来的对话不受影响。</p>
    <div class="actions">
      <button class="btn" id="regenCancel">取消</button>
      <button class="btn primary" id="regenConfirm">生成新令牌</button>
    </div>
  </div>
</div>

<script>
  // 界面只负责表达意图，具体怎么做在 Rust 那边。
  const invoke = window.__TAURI__.core.invoke;
  const listen = window.__TAURI__.event.listen;

  async function send(type, extra = {}) {
    try {
      switch (type) {
        case 'ready': render(await invoke('read_state')); break;
        case 'start':
        case 'stop':
        case 'restart': await invoke('control', { action: type }); break;
        case 'autostart': await invoke('set_autostart', { on: Boolean(extra.on) }); break;
        case 'lan': await invoke('set_lan', { on: Boolean(extra.on) }); break;
        case 'regenerate': await invoke('regenerate_token'); break;
        case 'copy': await invoke('copy_text', { text: extra.text }); toast('已复制'); break;
        case 'open': await invoke('open_target', { target: extra.target }); break;
      }
    } catch (error) {
      toast(typeof error === 'string' ? error : '这一步没做成。');
    }
  }
  const el = (id) => document.getElementById(id);

  let state = null;
  let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');

  function shortToken(token) {
    if (!token) return '还没生成';
    if (token.length <= 16) return token;
    return token.slice(0, 8) + ' ' + token.slice(8, 16) + ' … ' + token.slice(-6);
  }

  function render(next) {
    state = next;

    el('statusTitle').textContent = next.running ? '正在运行' : '已停止';
    el('statusDot').className = next.running ? 'dot' : 'dot off';
    el('statusSub').textContent = next.running
      ? (next.mode === 'service'
        ? [next.since, '后台服务，关掉这个窗口也照常跑'].filter(Boolean).join(' · ')
        : '便携模式，关掉这个窗口 Seven Station Core 就停了')
      : '客户端现在连不上，点「启动」把它拉起来';

    el('toggleBtn').textContent = next.running ? '停止' : '启动';
    el('restartBtn').hidden = !(next.running && next.serviceInstalled);

    // 局域网开着时别把 0.0.0.0 摊给用户看，换成这台机器在局域网里的地址。
    el('address').textContent = next.scope === 'lan' && next.localAddress
      ? next.listen.replace('0.0.0.0', next.localAddress)
      : next.listen;
    el('address').style.color = next.running ? '' : 'var(--text-faint)';
    el('openAddress').disabled = !next.running;
    el('token').textContent = shortToken(next.token);
    el('dataDir').textContent = next.dataDirectory;
    el('version').textContent = next.version;

    el('autostartSwitch').classList.toggle('on', next.autostart);
    el('autostartSwitch').disabled = !next.serviceInstalled;
    el('autostartText').textContent = next.serviceInstalled
      ? '系统启动时自动运行'
      : '便携模式不会自启';
    el('autostartText').style.color = next.serviceInstalled ? '' : 'var(--text-mute)';

    el('lanSwitch').classList.toggle('on', next.scope === 'lan');

    const logs = next.logs || [];
    el('logs').innerHTML = logs.length
      ? logs.map((line) => {
        // 日志行首的时间戳压暗、去掉毫秒，正文才是要看的。
        const hit = line.match(/^(\[?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?\]?|\[?\d{2}:\d{2}:\d{2}\]?)\s*(.*)$/);
        return hit
          ? '<span class="t">' + escapeHtml(hit[1].replace(/^\d{4}-\d{2}-\d{2} /, '').replace(/\.\d+$/, '')) + '</span> ' + escapeHtml(hit[2])
          : escapeHtml(line);
      }).join('\n')
      : '<span class="empty">还没有日志</span>';

    el('footNote').textContent = '数据在 ' + next.dataDirectory;
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  let toastTimer = 0;
  function toast(text) {
    const box = el('toast');
    box.textContent = text;
    box.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => box.classList.remove('show'), 2600);
  }

  el('toggleBtn').addEventListener('click', () => send(state && state.running ? 'stop' : 'start'));
  el('restartBtn').addEventListener('click', () => send('restart'));
  el('autostartSwitch').addEventListener('click', () => send('autostart', { on: !(state && state.autostart) }));
  el('lanSwitch').addEventListener('click', () => {
    send('lan', { on: !(state && state.scope === 'lan') });
  });

  el('copyAddress').addEventListener('click', () => send('copy', { text: el('address').textContent }));
  el('openAddress').addEventListener('click', () => send('open', { target: 'url' }));
  el('copyToken').addEventListener('click', () => send('copy', { text: state ? state.token : '' }));
  el('openData').addEventListener('click', () => send('open', { target: 'data' }));
  el('openLogs').addEventListener('click', () => send('open', { target: 'logs' }));

  el('regenToken').addEventListener('click', () => { el('scrim').hidden = false; });
  el('regenCancel').addEventListener('click', () => { el('scrim').hidden = true; });
  el('regenConfirm').addEventListener('click', () => {
    el('scrim').hidden = true;
    send('regenerate');
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !el('scrim').hidden) el('scrim').hidden = true;
  });

  listen('state', (event) => render(event.payload));
  listen('toast', (event) => toast(event.payload));

  send('ready');
</script>
</body>
</html>
